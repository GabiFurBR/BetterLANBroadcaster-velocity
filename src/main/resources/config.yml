# ============================================================
# BetterLANBroadcaster - Configuration
# ============================================================

# Language used by plugin messages.
# Available: en, br, zh, es, de, fr, ja, ru, it, ko, nl, pl, tr, uk, vi, id, cs, sv
language: en

# Enable diagnostic logging. Debug output is rate-limited.
debug: false

# Automatically start broadcasting when Velocity starts.
broadcast-enabled: false

# Interval between LAN multicast packets, in milliseconds.
# 1500 ms matches Minecraft's native LAN pinger cadence.
# Allowed range: 50 .. 86400000
broadcast-delay-ms: 1500

# Port advertised in the LAN discovery packet.
# 0 = use the port where Velocity is listening.
# This changes only the announced port, not Velocity's listening port.
broadcast-port: 0

# Network interface mode.
# auto = use every suitable IPv4 multicast-capable interface.
# You may also specify an interface name/display name or an IPv4 address.
network-interface: auto

# Interfaces excluded from auto-selection.
# Entries may match interface name, display name, or IPv4 address.
# Useful for VPNs and virtual adapters that should not announce LAN traffic.
network-interface-exclude: []

# MOTD sent in the Minecraft LAN discovery packet.
# Placeholders: {online}, {max}
# Supports legacy & color codes and MiniMessage tags.
# Protocol markers are removed from the final payload.
motd: "A Minecraft Server"

# ============================================================
# Minecraft LAN Discovery Protocol (fixed for compatibility)
# ============================================================
# IPv4 multicast group: 224.0.2.60
# UDP destination port: 4445
# TTL: 1
# Payload: [MOTD]Server MOTD[/MOTD][AD]Server Port[/AD]
# Encoding: UTF-8
# ============================================================
