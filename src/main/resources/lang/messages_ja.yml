  invalid-interface: "&c無効なネットワークインターフェースです。'auto'、インターフェース名、またはIPv4アドレスを指定してください。"
  invalid-syntax: "&c構文が不正です。使用方法: &f{0}"
  start-failed: "&cLANブロードキャストの開始に失敗しました。"
  reload-failed: "&cBetterLANBroadcasterの再読み込みに失敗しました。"
  configuration-error: "&c設定エラーが発生しました。詳細はコンソールを確認してください。"
  stop-failed: "&cLANブロードキャストの停止に失敗しました。"
  invalid-motd: "&c無効なMOTDです。空でないMOTDを入力してください。"
  config-save: "&c設定の保存に失敗しました。"
  interface-start: "&c選択したネットワークインターフェースでLANブロードキャストを再起動できませんでした。"
  invalid-debug: "&c無効なデバッグオプションです。&fon &cまたは &foff &cを使用してください。"
  config-reload: "&c設定の再読み込みに失敗しました。"
  reload-broadcast: "&c設定の再読み込み後にLANブロードキャストを再起動できませんでした。" 