  status:
    running: "&a&l● &a実行中"
    stopped: "&c&l○ &c停止中"
    motd: "&7MOTD: &f{0}"
    delay: "&7間隔: &f{0} ms"
    port: "&7ポート: &f{0}"
    interface: "&7インターフェース: &f{0}"

  motd-set: "&aMOTDを更新しました: &f{0}"
  delay-set: "&aブロードキャスト間隔を &f{0} ms &aに設定しました。"
  port-set: "&aブロードキャストポートを &f{0} &aに設定しました。"
  port-set-auto: "&aブロードキャストポートを自動検出に設定しました: &f{0}&a。"
  interface-set: "&aネットワークインターフェースを設定しました: &f{0}"

# ============================================================
# 設定
# ============================================================

config:
  reloaded: "&a設定を正常に再読み込みしました。"

# ============================================================
# デバッグ
# ============================================================

debug:
  "on": "&aデバッグモードを有効にしました。送信パケットがコンソールに記録されます。"
  "off": "&cデバッグモードを無効にしました。"
  status-on: "&a&l有効"
  status-off: "&7無効"
  label: "&7デバッグ: &f{0}"

# ============================================================
# ヘルプ
# ============================================================

help:
  title: "&6===== BetterLANBroadcaster ヘルプ ====="
  start: "&e/blb start &7- LANブロードキャストを開始"
  stop: "&e/blb stop &7- LANブロードキャストを停止"
  status: "&e/blb status &7- ステータスを表示"
  setmotd: "&e/blb setmotd <MOTD> &7- MOTDを設定"
  setdelay: "&e/blb setdelay <ミリ秒> &7- 間隔をミリ秒単位で設定"
  setport: "&e/blb setport <ポート|auto> &7- ポートを設定"
  setinterface: "&e/blb setinterface <auto|名前|IPv4> &7- ネットワークインターフェースを設定"
  debug: "&e/blb debug <on|off> &7- デバッグモードの切替"
  reload: "&e/blb reload &7- 設定を再読み込み"
  help: "&e/blb help &7- ヘルプを表示"
  version: "&e/blb version &7- プラグインのバージョンを表示"
  footer: "&6==================================="

# ============================================================
# バージョン
# ============================================================

version:
  line1: "&6BetterLANBroadcaster &ev{0}"
  line2: "&7作者: &f{0}"
  help-hint: "&7ヘルプを表示するには &f{0} &7と入力してください"

# ============================================================
# エラー
# ============================================================

error:
  no-permission: "&cこのコマンドを実行する権限がありません。"
  invalid-delay: "&c無効な間隔です。ミリ秒単位で正の数を入力してください。"
