  config-save: "&c无法保存配置文件。"
  interface-start: "&c无法使用指定的网络接口重新启动局域网广播。"
  invalid-debug: "&c无效的调试选项。请使用 &fon&c 或 &foff&c。"
  config-reload: "&c无法重新加载配置文件。"
