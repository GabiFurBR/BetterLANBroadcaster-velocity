  invalid-interface: "&cInterfaz de red no válida. Usa 'auto', el nombre de la interfaz o una dirección IPv4."
  invalid-syntax: "&cSintaxis no válida. Uso: &f{0}"
  start-failed: "&cNo se pudo iniciar la transmisión LAN."
  reload-failed: "&cNo se pudo recargar BetterLANBroadcaster."
  configuration-error: "&cOcurrió un error en la configuración. Revisa la consola para más detalles."
  stop-failed: "&cNo se pudo detener la transmisión LAN."
  invalid-motd: "&cMOTD no válido. Por favor, introduce un MOTD que no esté vacío."
  config-save: "&cNo se pudo guardar la configuración."
  interface-start: "&cNo se pudo reiniciar la transmisión LAN con la interfaz seleccionada."
  invalid-debug: "&cOpción de depuración no válida. Usa &fon&c o &foff&c."
  config-reload: "&cNo se pudo recargar la configuración."
  reload-broadcast: "&cNo se pudo reiniciar la transmisión LAN tras recargar la configuración."