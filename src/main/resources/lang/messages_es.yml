# Ayuda
# ============================================================

help:
  title: "&6===== Ayuda de BetterLANBroadcaster ====="
  start: "&e/blb start &7- Iniciar transmisión LAN"
  stop: "&e/blb stop &7- Detener transmisión LAN"
  status: "&e/blb status &7- Ver estado de la transmisión"
  setmotd: "&e/blb setmotd <MOTD> &7- Establecer el MOTD de transmisión"
  setdelay: "&e/blb setdelay <ms> &7- Establecer el intervalo en milisegundos"
  setport: "&e/blb setport <puerto|auto> &7- Establecer el puerto de transmisión"
  setinterface: "&e/blb setinterface <auto|nombre|IPv4> &7- Establecer la interfaz de red"
  debug: "&e/blb debug <on|off> &7- Activar o desactivar el modo depuración"
  reload: "&e/blb reload &7- Recargar la configuración"
  help: "&e/blb help &7- Mostrar esta ayuda"
  version: "&e/blb version &7- Mostrar la versión del plugin"
  footer: "&6==================================="

