# ============================================================
# Ajuda
# ============================================================

help:
  title: "&6===== Ajuda do BetterLANBroadcaster ====="
  start: "&e/blb start &7- Iniciar o broadcast LAN"
  stop: "&e/blb stop &7- Parar o broadcast LAN"
