# Versão
# ============================================================

version:
  line1: "&6BetterLANBroadcaster &ev{0}"
  line2: "&7Autores: &f{0}"
  help-hint: "&7Digite &f{0} &7para ver a ajuda"

# ============================================================
# Erros
# ============================================================

error:
  no-permission: "&cVocê não tem permissão para usar este comando."
  invalid-delay: "&cIntervalo inválido. Informe um número positivo em milissegundos."
  invalid-port: "&cPorta inválida. Informe um número entre 1 e 65535 ou use 'auto'."
  invalid-interface: "&cInterface de rede inválida. Use 'auto', o nome da interface ou um endereço IPv4."
  invalid-syntax: "&cSintaxe inválida. Uso: &f{0}"
  start-failed: "&cNão foi possível iniciar o broadcast LAN."
  reload-failed: "&cNão foi possível recarregar o BetterLANBroadcaster."
  configuration-error: "&cOcorreu um erro na configuração. Verifique o console para mais detalhes."
  stop-failed: "&cNão foi possível parar o broadcast LAN."
  invalid-motd: "&cMOTD inválida. Informe uma MOTD que não esteja vazia."
  config-save: "&cNão foi possível salvar a configuração."
  interface-start: "&cNão foi possível reiniciar o broadcast LAN com a interface de rede selecionada."
  invalid-debug: "&cOpção de debug inválida. Use &fon&c ou &foff&c."
  config-reload: "&cNão foi possível recarregar a configuração."
  reload-broadcast: "&cNão foi possível reiniciar o broadcast LAN após recarregar a configuração."

