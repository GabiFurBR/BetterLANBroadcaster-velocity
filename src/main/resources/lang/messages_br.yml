  setmotd: "&e/blb setmotd <MOTD> &7- Alterar a MOTD do broadcast"
  setdelay: "&e/blb setdelay <ms> &7- Alterar o intervalo do broadcast em milissegundos"
  setport: "&e/blb setport <porta|auto> &7- Definir a porta anunciada"
  setinterface: "&e/blb setinterface <auto|nome|IPv4> &7- Definir a interface de rede"
  debug: "&e/blb debug <on|off> &7- Ativar ou desativar o modo de debug"
  reload: "&e/blb reload &7- Recarregar a configuração"
  help: "&e/blb help &7- Mostrar esta ajuda"
  version: "&e/blb version &7- Mostrar a versão do plugin"
  footer: "&6==================================="

